<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestGames - Регистрация</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/register.css">
</head>

<body>
    <!-- Шапка сайта -->
    <header class="header">
        <div class="header__logo">
            <img src="../assets/media/images/logo/logo.png" alt="Логотип" class="header__logo-img">
            <a href="index.html" class="logo__title-link">BestGames</a>
        </div>
        <div class="header__navmenu">
            <a href="index.html#search" class="navmenu__el">Поиск</a>
            <a href="login.html" class="navmenu__el">Войти</a>
            <a href="profile.html" class="navmenu__el">Личный кабинет</a>
            <a href="catalog.html" class="navmenu__el">Каталог игр</a>
        </div>
        <div class="header__burger">
            <span class="burger__el"></span>
            <span class="burger__el"></span>
            <span class="burger__el"></span>
        </div>
    </header>
<!-- Основной контент -->

    <main>

        <div class="register">
            <div class="register__form">
                <h3 class="register__form-title">Регистрация</h3>
                <!-- Форма регистрации -->
                <form action="#" class="register__form-main">
                    <input type="email" class="register__form-input" placeholder="E-Mail: best@games.ru" name="email">
                    <input type="text" class="register__form-input" placeholder="Фамилия: Иванов" name="user_surname">
                    <input type="text" class="register__form-input" placeholder="Имя: Иван" name="user_name">
                    <input type="date" class="register__form-input" placeholder="Дата рождения" name="datebirth">
                    <input type="tel" class="register__form-input" placeholder="Телефон: (8-800-999-55-99)" name="phone_number">
                    <input type="password" class="register__form-input" placeholder="Пароль" name="password">
                    <input type="password" class="register__form-input" placeholder="Повтор пароля" name="submitpassword">
                    <div class="checkbox">
                        <input type="checkbox">
                        <p class="checkbox-text">Согласен на обработку данных</p>
                    </div>
                    <a href="login.html" class="register__form-btn">
                        Зарегистрироваться 
                    </a>
                    
                
                        
                </form>
            </div>
        </div>

    </main>

<!-- Подвал сайта -->
    <footer class="footer">
        <div class="footer__section">
            <p class="footer__section-text">Контакты</p>
            <p class="footer__section-text">Телефон (8-800-999-55-99)</p>
            <p class="footer__section-text">E-Mail: best@games.ru</p>
        </div>
        <div class="footer__section">
            <p class="footer__section-text">Клиентам</p>
            <p class="footer__section-text">Партнёрам</p>
            <p class="footer__section-text">О нас</p>
        </div>
        <div class="footer__section">
            <ul class="foouter__navmenu">
                <li class="foouter__navmenu-el"><a href="index.html" class="footer__navmenu-link">Главная</a></li>
                <li class="foouter__navmenu-el"><a href="register.html" class="footer__navmenu-link">Регистрация</a>
                </li>
                <li class="foouter__navmenu-el"><a href="register.html" class="footer__navmenu-link">Авторизация</a></li>
                <li class="foouter__navmenu-el"><a href="profile.html" class="footer__navmenu-link">Личный кабинет</a>
                </li>
                <li class="foouter__navmenu-el"><a href="index.html#search" class="footer__navmenu-link">Поиск</a></li>
            </ul>
        </div>
    </footer>
</body>

</html>
